name: Release

# Builds self-contained, single-file executables for Linux and Windows and attaches
# them to a GitHub Release. Triggered by pushing a tag like "v1.2.0", or manually via
# workflow_dispatch for one-off releases.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            ext: tar.gz
          - rid: win-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish proj2.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Package archive
        working-directory: publish/${{ matrix.rid }}
        run: |
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -r "${GITHUB_WORKSPACE}/dark-moon-${{ matrix.rid }}.zip" .
          else
            tar -czf "${GITHUB_WORKSPACE}/dark-moon-${{ matrix.rid }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dark-moon-${{ matrix.rid }}
          path: dark-moon-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: release/*
          generate_release_notes: true
